{% extends "base.html" %}
{% block content %}
<h2>Mis casos: {{ operator_name }}</h2>

<form class="filters" method="get">
  <input name="q" value="{{ q }}" placeholder="Buscar DNI o DID">
  <select name="status">
    <option value="">Todos</option>
    {% for st in ['pendiente','abierto','trabajado','sin_gestion','error'] %}
      <option value="{{ st }}" {% if status == st %}selected{% endif %}>{{ st }}</option>
    {% endfor %}
  </select>
  <button class="btn secondary">Filtrar</button>
</form>

<div class="table-wrap">
<table>
<thead><tr><th>#</th><th>DNI</th><th>DID</th><th>Estado</th><th>Observación</th><th>Acciones</th></tr></thead>
<tbody>
{% for r in rows %}
<tr>
  <td>{{ loop.index }}</td>
  <td>{{ r.dni }}</td>
  <td>{{ r.did }}</td>
  <td><span class="pill {{ r.status }}">{{ r.status }}</span></td>
  <td>
    <form method="post" action="{{ url_for('update_case', case_id=r.id) }}">
      <textarea name="notes" placeholder="Observación">{{ r.notes or '' }}</textarea>
      <select name="status">
        {% for st in ['abierto','trabajado','sin_gestion','error','pendiente'] %}
          <option value="{{ st }}" {% if r.status == st %}selected{% endif %}>{{ st }}</option>
        {% endfor %}
      </select>
      <button class="btn secondary smallbtn">Guardar</button>
    </form>
  </td>
  <td>
    <a class="btn" target="_blank" href="{{ url_for('open_case', case_id=r.id) }}">Abrir CRM</a>
  </td>
</tr>
{% else %}
<tr><td colspan="6" class="muted">No hay casos para este filtro.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
